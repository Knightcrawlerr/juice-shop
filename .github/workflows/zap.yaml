name: "zap-scan"

on:
 push:
   branches: [develop]
 pull_request:
   branches: [ main]

jobs:
 zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Start Juice Shop
        run: |
            nohup npm start &>/dev/null &
      - name: Wait for Juice Shop readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Ready after ${i}0s"; exit 0
            fi
            echo "attempt $i/30..."; sleep 10
          done
          echo "Juice Shop did not start" && exit 1 
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -I -j"
          allow_issue_writing: false

      - name: Upload ZAP SARIF report to s3
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp report_json.json s3://${{ secrets.S3_BUCKET_NAME }}/zap/$(date +%Y-%m-%d)/${{ github.sha }}.json
